# Default Sanna Constitution — sanna-openclaw
# This is a template. Customize for your governance requirements.

name: default
version: "1.0.0"
description: Default governance constitution for OpenClaw agents

rules:
  # Allow read operations by default
  - id: allow-read
    section: file-access
    description: Allow reading files
    match:
      action: Read
    effect: allow

  # Allow non-destructive bash commands
  - id: allow-safe-bash
    section: execution
    description: Allow non-destructive shell commands
    match:
      action: Bash
      parameters:
        command:
          not_contains:
            - "rm -rf"
            - "rm -r /"
            - "--force"
            - "drop database"
            - "DROP DATABASE"
            - "> /dev/"
    effect: allow

  # Escalate file writes outside the project
  - id: escalate-external-write
    section: file-access
    description: Require approval for writes outside the project directory
    match:
      action: Write
      parameters:
        file_path:
          not_starts_with: "./"
    effect: escalate

  # Allow writes within the project
  - id: allow-project-write
    section: file-access
    description: Allow writes within the project directory
    match:
      action: Write
      parameters:
        file_path:
          starts_with: "./"
    effect: allow

  # Deny destructive bash commands
  - id: deny-destructive
    section: execution
    description: Block destructive shell commands
    match:
      action: Bash
      parameters:
        command:
          contains_any:
            - "rm -rf /"
            - "rm -rf ~"
            - ":(){:|:&};:"
            - "mkfs"
            - "dd if="
    effect: deny

  # Escalate git push to protected branches
  - id: escalate-protected-push
    section: git
    description: Require approval for push to main/master
    match:
      action: Bash
      parameters:
        command:
          contains_any:
            - "git push origin main"
            - "git push origin master"
            - "push --force"
    effect: escalate
