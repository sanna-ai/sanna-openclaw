# OpenClaw Personal Assistant — Conservative Governance
#
# Most operations require human approval. Only safe read-only
# commands run autonomously. Destructive actions are blocked.

sanna_constitution: "1.0.0"

identity:
  agent_name: openclaw-personal-assistant
  domain: personal-computing
  description: >
    Personal assistant agent with conservative governance.
    Read-only operations are autonomous; all writes and external
    actions require human approval.

provenance:
  authored_by: template@sanna.dev
  approved_by:
    - template@sanna.dev
  approval_date: "2026-02-24"
  approval_method: manual-sign-off
  change_history:
    - version: "1.0.0"
      date: "2026-02-24"
      description: Initial template for OpenClaw personal assistant governance

boundaries:
  - id: B001
    description: >
      Agent may only read files and run safe, non-destructive shell commands
      without human approval.
    category: scope
    severity: medium

  - id: B002
    description: >
      All file creation, modification, and deletion must be approved by the user.
    category: authorization
    severity: high

  - id: B003
    description: >
      No access to credentials, private keys, or sensitive system files.
    category: confidentiality
    severity: critical

  - id: B004
    description: >
      Destructive system commands are permanently blocked.
    category: safety
    severity: critical

  - id: B005
    description: >
      No binding of network ports or starting of server processes.
    category: safety
    severity: high

trust_tiers:
  autonomous:
    - "Read files and view directory contents"
    - "Run safe shell commands: ls, cat, pwd, echo, wc, head, tail, grep, find, which, env, date, whoami"
  requires_approval:
    - "Create or modify files"
    - "Run shell commands beyond the safe list"
    - "All browser operations"
    - "Send messages via the message tool"
    - "Schedule tasks via the cron tool"
    - "Install packages via npm or pip"
  prohibited:
    - "Run rm -rf, format, dd, or mkfs"
    - "Use sudo, su, or doas"
    - "Read .env, .key, .pem, /etc/shadow, or ~/.ssh contents"
    - "Write to /etc, /usr, /var, or /sys"
    - "Bind network ports or start server processes"

halt_conditions:
  - id: H001
    trigger: Agent attempts a destructive command (rm -rf, dd, mkfs, format)
    escalate_to: user@local
    severity: critical
    enforcement: halt

  - id: H002
    trigger: Agent attempts to read credentials or private keys
    escalate_to: user@local
    severity: critical
    enforcement: halt

  - id: H003
    trigger: Agent attempts to modify system directories
    escalate_to: user@local
    severity: critical
    enforcement: halt

invariants:
  - id: INV_NO_FABRICATION
    rule: Do not claim facts absent from provided sources.
    enforcement: halt

  - id: INV_MARK_INFERENCE
    rule: Clearly mark inferences and speculation as such.
    enforcement: warn

  - id: INV_NO_FALSE_CERTAINTY
    rule: Do not express certainty exceeding evidence strength.
    enforcement: warn

authority_boundaries:
  can_execute:
    # exec — read-only safe commands
    - "exec:ls"
    - "exec:cat"
    - "exec:pwd"
    - "exec:echo"
    - "exec:wc"
    - "exec:head"
    - "exec:tail"
    - "exec:grep"
    - "exec:find"
    - "exec:which"
    - "exec:env"
    - "exec:date"
    - "exec:whoami"

  cannot_execute:
    # Destructive commands
    - "exec:rm -rf"
    - "exec:format"
    - "exec:dd"
    - "exec:mkfs"
    # Privilege escalation
    - "exec:sudo"
    - "exec:su"
    - "exec:doas"
    # Credential access
    - "exec:cat .env"
    - "exec:cat .key"
    - "exec:cat .pem"
    - "exec:cat /etc/shadow"
    - "exec:cat ~/.ssh"
    # System modification
    - "write:/etc"
    - "write:/usr"
    - "write:/var"
    - "write:/sys"
    - "edit:/etc"
    - "edit:/usr"
    - "edit:/var"
    - "edit:/sys"
    # Network listeners
    - "exec:nc -l"
    - "exec:python -m http.server"
    - "exec:node --listen"

  must_escalate:
    - condition: "Any file creation or modification via write or edit tools"
      target:
        type: log
    - condition: "Shell commands not in the safe read-only list"
      target:
        type: log
    - condition: "Any browser operation via browser_navigate, browser_click, or browser_type"
      target:
        type: log
    - condition: "Sending messages via the message tool"
      target:
        type: log
    - condition: "Scheduling tasks via the cron tool"
      target:
        type: log
    - condition: "Installing packages via npm install or pip install"
      target:
        type: log

escalation_targets:
  default: log
