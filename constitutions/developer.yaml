# Sanna Constitution: Developer Workspace
# ─────────────────────────────────────────────────────────────────────
# Balanced governance for development workflows. Full workspace access
# with escalation for external communication, infrastructure changes,
# and dangerous command patterns.
#
# EVALUATION ORDER (this matters)
# ================================
# The engine evaluates boundaries in strict priority order and returns
# the FIRST match. Understanding this order is critical to writing
# constitutions that work.
#
#   1. cannot_execute  — checked FIRST, matches TOOL NAMES ONLY
#      → If the tool name matches, verdict is HALT. Done. Nothing
#        else is checked.
#
#   2. must_escalate   — checked SECOND, matches FULL ACTION CONTEXT
#      → If any condition's keywords appear in the tool name + all
#        parameter names + all parameter values, verdict is ESCALATE.
#        Done. Nothing else is checked.
#
#   3. can_execute     — checked THIRD, matches TOOL NAMES ONLY
#      → If the tool name matches, verdict is ALLOW.
#
#   4. default         — if nothing matched, verdict is ALLOW
#      (uncategorized action)
#
# WHY THIS MATTERS
# ────────────────
# A tool in can_execute is STILL subject to must_escalate conditions.
# "exec" is allowed, but exec(command="sudo rm -rf /") hits the
# "sudo" and "rm -rf" escalation conditions BEFORE can_execute fires.
#
# A tool in cannot_execute is NEVER subject to must_escalate conditions.
# If "cron" is in cannot_execute, it's halted immediately — the engine
# never reaches must_escalate to check parameters.
#
# COMMON MISTAKE
# ──────────────
# Putting command patterns in cannot_execute. If you add "crontab" to
# cannot_execute, it only blocks a tool literally named "crontab". An
# agent calling exec(command="crontab -l") sails right through because
# cannot_execute only matches tool names, and the tool name is "exec".
# Move command patterns to must_escalate conditions instead.
#
# RULE OF THUMB
# ─────────────
# Governing what a tool IS → cannot_execute / can_execute (tool names)
# Governing what a tool DOES → must_escalate conditions (parameters)
#
sanna_constitution: "0.1.0"

identity:
  agent_name: openclaw-developer
  domain: software-development
  description: >-
    Development agent with full workspace access including process control.
    External communication and session management require escalation.
    Dangerous command patterns (privilege escalation, destructive operations,
    infrastructure changes) require escalation even through allowed tools.
    Direct infrastructure orchestration tools are prohibited.

provenance:
  authored_by: sanna-openclaw
  approved_by:
    - team-lead
  approval_date: "2026-02-26"
  approval_method: template

boundaries:
  - id: B001
    description: Agent operates within the development workspace
    category: scope
    severity: medium

  - id: B002
    description: External communication requires escalation
    category: safety
    severity: high

  - id: B003
    description: Infrastructure orchestration tools are prohibited
    category: authorization
    severity: critical

  - id: B004
    description: >-
      Dangerous command patterns require escalation regardless of which
      tool executes them. Covers privilege escalation, destructive
      operations, and system-level changes routed through exec or bash.
    category: safety
    severity: critical

authority_boundaries:

  # ── DENY (tool name match) ──────────────────────────────────────
  # Matches tool names only. Use for tools that should NEVER be
  # called directly, regardless of parameters.
  cannot_execute:
    - nodes       # direct Node.js orchestration
    - cron        # direct cron management
    - gateway     # gateway configuration

  # ── ESCALATE (full context match) ───────────────────────────────
  # Matches tool name AND parameters. Use for dangerous PATTERNS
  # that could appear inside any allowed tool's arguments.
  #
  # Each condition is keyword-matched against the full action context
  # string: "toolname paramkey paramvalue paramkey paramvalue ..."
  # All significant words (3+ chars, no stop words) must appear.
  must_escalate:
    # External communication
    - condition: message
    - condition: sessions_send
    - condition: sessions_spawn

    # Privilege escalation
    - condition: sudo
    - condition: chmod 777
    - condition: chown

    # Destructive operations
    - condition: rm -rf
    - condition: mkfs
    - condition: dd if

    # System/infrastructure changes via exec
    - condition: crontab
    - condition: shutdown
    - condition: reboot
    - condition: systemctl
    - condition: iptables
    - condition: ufw

    # Package/environment modification
    - condition: apt remove
    - condition: pip uninstall
    - condition: npm uninstall

  # ── ALLOW (tool name match) ─────────────────────────────────────
  # Matches tool names only. These tools are permitted but still
  # subject to must_escalate conditions on their parameters.
  can_execute:
    - exec
    - bash
    - write
    - edit
    - apply_patch
    - process
    - browser
    - web_search
    - web_fetch
